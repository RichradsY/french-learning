<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#183153">
  <title>Mon français</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Aller au contenu</a>
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">fr</span><span>Mon français</span></div>
    <nav aria-label="Navigation principale">
      <button class="nav-item active" data-view="today">Aujourd’hui</button>
      <button class="nav-item" data-view="reading">Lecture</button>
      <button class="nav-item" data-view="writing">Écriture</button>
      <button class="nav-item" data-view="review">Erreurs & grammaire</button>
      <button class="nav-item" data-view="vocabulary">Vocabulaire</button>
      <button class="nav-item" data-view="history">Historique</button>
    </nav>
  </header>
  <main id="content" tabindex="-1">
    <div id="status" class="status" role="status" aria-live="polite">Préparation de votre séance…</div>
    <section id="view" aria-live="polite"></section>
  </main>
  <footer>Votre historique reste sur cet ordinateur · Séance préparée chaque jour à 07:00</footer>
  <script src="/app.js" defer></script>
</body>
</html>
